<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Kör Sıralama">
    <link rel="apple-touch-icon" href="https://ui-avatars.com/api/?name=KS&background=38bdf8&color=fff&size=512&font-size=0.4&bold=true">
    
    <title>KÖR SIRALAMA PRO - EA FC 27</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-dark: #1e293b;
            --bg-card: #273549;
            --text-main: #ffffff;
            --text-muted: #cbd5e1;
            
            --red: #ef4444;
            --white: #ffffff;
            --light-blue: #38bdf8;
            --yellow: #f59e0b;
            --green: #10b981;

            --accent: var(--light-blue);
            --play-color: var(--green);
            --bench-color: var(--yellow);
            --sell-color: var(--red);
            
            --radius: 18px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-user-select: none; user-select: none; touch-action: manipulation; }

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: var(--bg-dark); 
            color: var(--text-main); 
            display: flex; justify-content: center; align-items: center; 
            height: 100vh; height: 100dvh; width: 100vw; overflow: hidden; 
        }
        img { pointer-events: none; }

        .screen {
            background: var(--bg-card); 
            width: 100%; max-width: 420px; 
            height: 100vh; height: 100dvh;
            border-radius: 0px; padding: 14px 16px; 
            display: none; flex-direction: column; justify-content: space-between;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4); 
            border: 1px solid rgba(255, 255, 255, 0.12);
            overflow: hidden;
        }
        @media (min-height: 700px) and (min-width: 440px) {
            .screen { height: 94dvh; border-radius: var(--radius); }
        }

        .active { display: flex; animation: fadeUp 0.35s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* HEADER */
        .header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 8px; border-bottom: 1px solid rgba(255,255,255,0.08); flex-shrink: 0; }
        .logo-container { font-size: 38px; color: var(--accent); text-align: center; filter: drop-shadow(0px 0px 10px var(--accent)); transition: 0.3s; margin-bottom: 4px; }
        h1 { font-weight: 800; font-size: 22px; text-align: center; letter-spacing: -0.5px; }
        .subtitle { text-align: center; color: var(--text-muted); font-size: 11px; font-weight: 700; letter-spacing: 2px; margin-bottom: 10px; }

        .high-score-box {
            background: rgba(56, 189, 248, 0.12); border: 1px solid rgba(56, 189, 248, 0.25);
            border-radius: 12px; padding: 8px 12px; text-align: center; margin-bottom: 12px;
            font-size: 12px; font-weight: 700; color: var(--accent); display: flex; align-items: center; justify-content: center; gap: 8px;
        }

        .menu-buttons, .action-buttons { display: flex; flex-direction: column; gap: 8px; width: 100%; flex-shrink: 0; }

        button { 
            font-family: inherit; border: none; border-radius: 12px; 
            padding: 12px 16px; font-size: 13px; font-weight: 700; 
            cursor: pointer; display: flex; align-items: center; justify-content: center; 
            gap: 8px; transition: all 0.2s ease; -webkit-tap-highlight-color: transparent; 
        }
        button:active { transform: scale(0.97); }
        .btn-primary { background: var(--accent); color: #0f172a; box-shadow: 0 4px 14px rgba(56, 189, 248, 0.35); font-weight: 800;}
        .btn-secondary { background: rgba(255,255,255,0.08); color: var(--text-main); border: 1px solid rgba(255,255,255,0.12); }
        .icon-btn { background: transparent; color: var(--text-muted); padding: 4px; font-size: 20px; }

        /* OYUN KARTI VE ARKA PLAN LOGOSU */
        .player-card {
            border-radius: 16px; padding: 12px; display: flex; flex-direction: column;
            align-items: center; justify-content: space-between; position: relative;
            flex: 1; min-height: 0; margin: 8px 0;
            background: linear-gradient(160deg, #334155 0%, #1e293b 100%);
            border: 1px solid rgba(255,255,255,0.15);
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .card-team-logo-bg {
            position: absolute; 
            top: 50%; left: 50%; 
            transform: translate(-50%, -50%); 
            width: 250px; height: 250px;
            opacity: 0.28; 
            filter: drop-shadow(0 0 20px rgba(255, 255, 255, 0.3)); 
            pointer-events: none; z-index: 1;
            object-fit: contain;
            display: block;
        }

        .card-top-row {
            display: flex; justify-content: space-between; align-items: center; width: 100%; z-index: 2;
        }
        .team-badge-container {
            display: flex; align-items: center; gap: 6px; background: rgba(15, 23, 42, 0.65);
            padding: 4px 10px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.2);
        }
        .team-logo-img { width: 22px; height: 22px; object-fit: contain; }
        .team-badge-text { font-size: 11px; font-weight: 700; color: #f8fafc; }

        .player-image-wrap {
            position: relative; z-index: 2; margin: 4px 0;
            display: flex; justify-content: center; align-items: center;
        }
        .player-image { 
            width: 95px; height: 95px; border-radius: 50%; 
            object-fit: cover; object-position: top center; 
            border: 3px solid var(--accent); 
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4); 
            background-color: #0f172a; 
        }

        .player-info { text-align: center; width: 100%; display: flex; flex-direction: column; align-items: center; z-index: 2; }
        .player-info h2 { 
            font-size: 17px; font-weight: 800; white-space: nowrap; 
            overflow: hidden; text-overflow: ellipsis; width: 100%; 
            letter-spacing: -0.3px; color: var(--white); margin-bottom: 4px;
        }

        .rating-badge { 
            display: inline-block; background: var(--accent); color: #0f172a; 
            padding: 3px 10px; border-radius: 6px; font-weight: 800; font-size: 13px; 
            margin-bottom: 6px; flex-shrink: 0;
        }

        .team-pos-row { display: flex; justify-content: center; align-items: center; gap: 6px; width: 100%; }
        .pos-badge { font-size: 10px; font-weight: 800; padding: 3px 6px; border-radius: 4px; color: white; letter-spacing: 0.5px; flex-shrink: 0;}
        .pos-KL { background: var(--yellow); color: #000; } 
        .pos-DF { background: var(--light-blue); color: #000; } 
        .pos-OS { background: var(--green); color: #000; } 
        .pos-FV { background: var(--red); color: #fff; }
        .league-name { color: var(--text-muted); font-size: 11px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .btn-action { color: white; justify-content: flex-start; padding-left: 16px; font-size: 13px; font-weight: 700; height: 42px;}
        .btn-oynat { background: var(--play-color); color: #000; } 
        .btn-yedek { background: var(--bench-color); color: #000; } 
        .btn-sat { background: var(--sell-color); color: #fff; }

        .settings-group { margin-bottom: 10px; background: rgba(255,255,255,0.05); padding: 10px 12px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.08); flex-shrink: 0;}
        .settings-group label { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; font-size: 12px; font-weight: 700; color: var(--accent); }
        
        .color-palette { display: flex; gap: 8px; justify-content: flex-start; }
        .color-swatch { width: 28px; height: 28px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; transition: 0.2s;}
        .color-swatch.active-color { border-color: white; transform: scale(1.15); box-shadow: 0 0 10px rgba(255,255,255,0.4); }

        .checkbox-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .cb-label { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-main); font-weight: 500; cursor: pointer; background: rgba(0,0,0,0.2); padding: 8px; border-radius: 8px;}
        .cb-label input { width: 16px; height: 16px; accent-color: var(--accent); flex-shrink: 0;}

        .toggle-btn { background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.08); color: white; width: 100%; padding: 10px; margin-bottom: 6px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; font-size: 12px; font-weight: 600;}
        .toggle-btn.off { color: var(--text-muted); opacity: 0.6; }

        .results-container { flex: 1; min-height: 0; overflow-y: auto; padding-right: 2px; margin-bottom: 8px; }
        .result-item { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08); border-radius: 10px; padding: 8px 10px; margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; }
        .result-item img.res-player-img { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; object-position: top center; margin-right: 8px; flex-shrink: 0;}
        .result-item img.res-team-logo { width: 18px; height: 18px; object-fit: contain; vertical-align: middle; margin-right: 4px; }
        .result-player-info { display: flex; align-items: center; overflow: hidden; width: 68%;}
        
        .score-card { 
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.25), rgba(30, 41, 59, 0.9)); 
            padding: 12px; border-radius: 14px; text-align: center; margin: 6px 0 10px 0; 
            border: 1px solid rgba(56, 189, 248, 0.35); flex-shrink: 0;
        }
        .score-card p { font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--text-muted); font-weight: 700; }
        
        #total-score { 
            font-size: 38px; margin-top: 2px; color: var(--white); font-weight: 800; 
            opacity: 0; filter: blur(12px); transform: scale(0.7);
        }
        .score-fadeIn {
            animation: slowScoreReveal 2.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes slowScoreReveal {
            0% { opacity: 0; filter: blur(12px); transform: scale(0.6); }
            40% { opacity: 0.3; filter: blur(6px); transform: scale(0.9); }
            100% { opacity: 1; filter: blur(0); transform: scale(1); }
        }

        .turn-badge { background: rgba(255,255,255,0.12); padding: 4px 10px; border-radius: 14px; font-size: 11px; font-weight: 700; letter-spacing: 1px; color: var(--accent); }
        
        .loading-overlay { position: absolute; inset: 0; background: var(--bg-card); border-radius: 16px; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 10; gap: 10px; color: var(--accent); font-size: 13px; font-weight: 700; transition: 0.2s; }
        .last-action-badge { display: flex; align-items: center; justify-content: center; height: 42px; border-radius: 12px; font-size: 14px; font-weight: 800; color: white; text-align: center; width: 100%; margin-bottom: 6px; border: 1px solid rgba(255,255,255,0.2); text-transform: uppercase; letter-spacing: 0.5px;}
        .badge { padding: 3px 6px; border-radius: 4px; font-size: 10px; font-weight: 800; letter-spacing: 0.5px;}
        .badge-play { background: var(--play-color); color: #000; } 
        .badge-bench { background: var(--bench-color); color: #000; } 
        .badge-sell { background: var(--sell-color); color: #fff; }
    </style>
</head>
<body>

    <audio id="bg-music" loop src="https://cdn.pixabay.com/download/audio/2022/02/10/audio_fc86ecf136.mp3"></audio>
    <audio id="click-sound" src="https://cdn.pixabay.com/download/audio/2021/08/04/audio_bb630cc098.mp3"></audio>

    <!-- MENÜ EKRANI -->
    <div class="screen active" id="menu-screen">
        <div style="text-align: center; margin-top: 10px;">
            <div class="logo-container" id="main-logo"><i class="fa-solid fa-futbol"></i></div>
            <h1>KÖR SIRALAMA</h1>
            <p class="subtitle">EA FC 27 KARİYER MODU</p>
        </div>

        <div class="high-score-box" id="high-score-display">
            <i class="fa-solid fa-trophy" style="color: var(--yellow);"></i> En Yüksek Skor: <span id="high-score-val">0</span>
        </div>

        <div class="menu-buttons" style="margin-bottom: 10px;">
            <button class="btn-primary" onclick="startGame()"><i class="fa-solid fa-play"></i> OYUNA BAŞLA</button>
            <button class="btn-secondary" onclick="showScreen('history-screen'); loadHistory();"><i class="fa-solid fa-clock-rotate-left"></i> OYUN GEÇMİŞİ</button>
            <button class="btn-secondary" onclick="showScreen('settings-screen')"><i class="fa-solid fa-sliders"></i> AYARLAR VE HAKKINDA</button>
        </div>
    </div>

    <!-- GEÇMİŞ EKRANI -->
    <div class="screen" id="history-screen">
        <div class="header">
            <h2><i class="fa-solid fa-clock-rotate-left"></i> Geçmiş</h2>
            <button class="icon-btn" onclick="showScreen('menu-screen')"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div id="history-list" style="flex:1; overflow-y:auto; margin: 10px 0;"></div>
        <button class="btn-secondary" onclick="clearHistory()" style="background:var(--red); color:white;"><i class="fa-solid fa-trash"></i> Temizle</button>
    </div>

    <!-- AYARLAR EKRANI -->
    <div class="screen" id="settings-screen">
        <div class="header">
            <h2><i class="fa-solid fa-sliders"></i> Ayarlar</h2>
            <button class="icon-btn" onclick="showScreen('menu-screen')"><i class="fa-solid fa-xmark"></i></button>
        </div>
        
        <div style="flex: 1; overflow-y: auto;">
            <div class="settings-group">
                <label><i class="fa-solid fa-palette"></i> Renk Teması</label>
                <div class="color-palette">
                    <div class="color-swatch active-color" style="background: #38bdf8;" onclick="changeTheme('#38bdf8', this)"></div>
                    <div class="color-swatch" style="background: #ef4444;" onclick="changeTheme('#ef4444', this)"></div>
                    <div class="color-swatch" style="background: #10b981;" onclick="changeTheme('#10b981', this)"></div>
                    <div class="color-swatch" style="background: #f59e0b;" onclick="changeTheme('#f59e0b', this)"></div>
                    <div class="color-swatch" style="background: #ffffff;" onclick="changeTheme('#ffffff', this)"></div>
                </div>
            </div>

            <div class="settings-group">
                <label><i class="fa-solid fa-bolt"></i> Modlar</label>
                <button id="btn-toggle-hard" class="toggle-btn off" onclick="toggleHardMode()">
                    <span><i class="fa-solid fa-mask"></i> Zor Mod (Reyting Gizle)</span> <span id="hard-status">KAPALI</span>
                </button>
            </div>

            <div class="settings-group">
                <label><i class="fa-solid fa-headphones"></i> Ses Yönetimi</label>
                <button id="btn-toggle-music" class="toggle-btn off" onclick="toggleMusic()">
                    <span><i class="fa-solid fa-music"></i> Müzik</span> <span id="music-status">KAPALI</span>
                </button>
                <button id="btn-toggle-sfx" class="toggle-btn" onclick="toggleSFX()">
                    <span><i class="fa-solid fa-bell"></i> Tuş Sesleri</span> <span id="sfx-status">AÇIK</span>
                </button>
            </div>

            <div class="settings-group">
                <label><i class="fa-solid fa-earth-europe"></i> Lig Filtresi</label>
                <div class="checkbox-grid" id="league-checkboxes">
                    <label class="cb-label"><input type="checkbox" value="superlig" checked> 🇹🇷 Süper Lig</label>
                    <label class="cb-label"><input type="checkbox" value="premier" checked> 🏴󠁧󠁢󠁥󠁮󠁧󠁿 Premier L.</label>
                    <label class="cb-label"><input type="checkbox" value="laliga" checked> 🇪🇸 La Liga</label>
                    <label class="cb-label"><input type="checkbox" value="seriea" checked> 🇮🇹 Serie A</label>
                    <label class="cb-label"><input type="checkbox" value="bundesliga" checked> 🇩🇪 Bundesliga</label>
                    <label class="cb-label"><input type="checkbox" value="ligue1" checked> 🇫🇷 Ligue 1</label>
                </div>
            </div>

            <div class="settings-group">
                <label><i class="fa-solid fa-street-view"></i> Mevki Filtresi</label>
                <div class="checkbox-grid" id="pos-checkboxes">
                    <label class="cb-label"><input type="checkbox" value="KL" checked> 🧤 Kaleci (KL)</label>
                    <label class="cb-label"><input type="checkbox" value="DF" checked> 🛡️ Defans (DF)</label>
                    <label class="cb-label"><input type="checkbox" value="OS" checked> 👟 Orta (OS)</label>
                    <label class="cb-label"><input type="checkbox" value="FV" checked> 🎯 Forvet (FV)</label>
                </div>
            </div>
        </div>
    </div>

    <!-- OYUN EKRANI -->
    <div class="screen" id="game-screen">
        <div class="header" style="justify-content: center;">
            <span class="turn-badge" id="turn-text">1. OYUNCU</span>
        </div>
        
        <div class="player-card" id="active-card">
            <div class="loading-overlay" id="loading-overlay">
                <i class="fa-solid fa-circle-notch fa-spin fa-2x"></i>
                <span id="loading-text">Yükleniyor...</span>
            </div>

            <!-- ARKA PLANDA ORTALANMIŞ VE GÖLGELİ BÜYÜK LOGO -->
            <img id="card-bg-logo" class="card-team-logo-bg" src="" alt="" referrerpolicy="no-referrer" onerror="handleImgError(this)">

            <div class="card-top-row">
                <div class="team-badge-container">
                    <img id="player-team-logo" class="team-logo-img" src="" alt="Takım Logo" referrerpolicy="no-referrer" onerror="handleImgError(this)">
                    <span id="player-team" class="team-badge-text">---</span>
                </div>
                <span id="player-league-icon" style="font-size: 18px;">🌍</span>
            </div>

            <div class="player-image-wrap">
                <img id="player-image" class="player-image" src="" alt="Oyuncu">
            </div>

            <div class="player-info">
                <h2 id="player-name">---</h2>
                <div class="rating-badge" id="player-rating">R: --</div>
                <div class="team-pos-row">
                    <span class="pos-badge" id="player-pos">--</span>
                    <span id="player-league-name" class="league-name">---</span>
                </div>
            </div>
        </div>

        <div class="action-buttons" id="action-buttons">
            <button class="btn-action btn-oynat" id="btn-oynat" onclick="selectAction('oynat')"><i class="fa-solid fa-shirt"></i> İLK 11'DE OYNAT</button>
            <button class="btn-action btn-yedek" id="btn-yedek" onclick="selectAction('yedek')"><i class="fa-solid fa-chair"></i> YEDEK BIRAK</button>
            <button class="btn-action btn-sat" id="btn-sat" onclick="selectAction('sat')"><i class="fa-solid fa-handshake"></i> TRANSFER ET (SAT)</button>
        </div>

        <div class="action-buttons" id="last-player-area" style="display: none;">
            <div id="last-action-display" class="last-action-badge">---</div>
            <button class="btn-primary" onclick="endGame()" style="width: 100%; height: 42px;"><i class="fa-solid fa-file-invoice"></i> MAÇ RAPORUNU GÖR</button>
        </div>
    </div>

    <!-- SONUÇ EKRANI -->
    <div class="screen" id="result-screen">
        <div class="header"><h2><i class="fa-solid fa-chart-simple"></i> Maç Raporu</h2></div>
        
        <div class="results-container" id="results-list"></div>
        
        <div class="score-card" id="score-card-bg">
            <p>Toplam Kazancın</p>
            <h2 id="total-score">0</h2>
        </div>

        <div class="menu-buttons">
            <button class="btn-primary" onclick="startGame()"><i class="fa-solid fa-rotate-right"></i> YENİ MAÇA ÇIK</button>
            <button class="btn-secondary" onclick="showScreen('menu-screen')"><i class="fa-solid fa-house"></i> ANA MENÜ</button>
        </div>
    </div>

    <script>
        let isHardMode = false, isSfxMuted = false, isMusicMuted = true;
        const clickSound = document.getElementById('click-sound');
        const bgAudio = document.getElementById('bg-music');
        bgAudio.volume = 0.3;

        document.addEventListener("visibilitychange", () => {
            if (document.hidden) { bgAudio.pause(); } 
            else { if (!isMusicMuted) bgAudio.play().catch(()=>{}); }
        });

        /* YÜKSEK ÇÖZÜNÜRLÜKLÜ DOĞRUDAN KULÜP LOGO BAĞLANTILARI */
        const TEAM_LOGOS = {
            "GALATASARAY": "https://images.fotmob.com/image_resources/logo/teamlogo/8637.png",
            "FENERBAHÇE": "https://assets.football-logos.cc/logos/turkey/512x512/fenerbahce.ad038cac.png",
            "BEŞİKTAŞ": "https://assets.football-logos.cc/logos/turkey/512x512/besiktas.0ec1a299.png",
            "TRABZONSPOR": "https://assets.football-logos.cc/logos/turkey/512x512/trabzonspor.32812ba8.png",
            "REAL MADRID": "https://images.fotmob.com/image_resources/logo/teamlogo/8633.png",
            "BARCELONA": "https://images.fotmob.com/image_resources/logo/teamlogo/8634.png",
            "ATLÉTICO MADRID": "https://images.fotmob.com/image_resources/logo/teamlogo/9906.png",
            "BAYERN MÜNİH": "https://images.fotmob.com/image_resources/logo/teamlogo/9823.png",
            "BORUSSIA DORTMUND": "https://images.fotmob.com/image_resources/logo/teamlogo/9789.png",
            "PSG": "https://images.fotmob.com/image_resources/logo/teamlogo/9847.png",
            "ARSENAL": "https://images.fotmob.com/image_resources/logo/teamlogo/9825.png",
            "MANCHESTER CITY": "https://images.fotmob.com/image_resources/logo/teamlogo/8456.png",
            "LIVERPOOL": "https://images.fotmob.com/image_resources/logo/teamlogo/8650.png",
            "CHELSEA": "https://images.fotmob.com/image_resources/logo/teamlogo/8455.png",
            "MANCHESTER UNITED": "https://images.fotmob.com/image_resources/logo/teamlogo/10260.png",
            "INTER MILAN": "https://images.fotmob.com/image_resources/logo/teamlogo/8635.png",
            "AS ROMA": "https://images.fotmob.com/image_resources/logo/teamlogo/8686.png",
            "AC MILAN": "https://images.fotmob.com/image_resources/logo/teamlogo/8564.png",
            "JUVENTUS": "https://images.fotmob.com/image_resources/logo/teamlogo/9885.png",

                img.src = FALLBACK_LOGOS[teamName];
            } else {

            }

        }

        let gamePool = [], currentPlayers = [], currentPlayerIndex = 0, availableActions = ["oynat", "yedek", "sat"], assignments = {};

        async function fetchPlayerImage(playerName) {
            try {
                let searchQuery = `"${playerName}" "footballer" OR "soccer"`;
                let url = `https://en.wikipedia.org/w/api.php?action=query&generator=search&gsrsearch=${encodeURIComponent(searchQuery)}&gsrlimit=1&prop=pageimages&pithumbsize=500&format=json&origin=*`;
                let res = await fetch(url); let data = await res.json();
                if(data.query?.pages) { 
                    let pageId = Object.keys(data.query.pages)[0]; 
                    if(data.query.pages[pageId].thumbnail) return data.query.pages[pageId].thumbnail.source; 
                }
                
                let fallbackUrl = `https://en.wikipedia.org/w/api.php?action=query&generator=search&gsrsearch=${encodeURIComponent(playerName)}&gsrlimit=1&prop=pageimages&pithumbsize=500&format=json&origin=*`;
                let res2 = await fetch(fallbackUrl); let data2 = await res2.json();
                if(data2.query?.pages) { 
                    let pageId = Object.keys(data2.query.pages)[0]; 
                    if(data2.query.pages[pageId].thumbnail) return data2.query.pages[pageId].thumbnail.source; 
                }
                throw new Error("Resim yok");
            } catch (e) {
                return `https://ui-avatars.com/api/?name=${encodeURIComponent(playerName)}&background=334155&color=fff&size=500&bold=true&font-size=0.33`;
            }
        }

        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        function shuffleArray(array) {
            let arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; }
            return arr;
        }

        function startGame() {
            playSound();
            if(!isMusicMuted) bgAudio.play().catch(()=>{});
            showScreen('game-screen');
            
            let checkedLeagues = Array.from(document.querySelectorAll('#league-checkboxes input:checked')).map(cb => cb.value);
            let checkedPos = Array.from(document.querySelectorAll('#pos-checkboxes input:checked')).map(cb => cb.value);
            
            let filteredDB = database.filter(p => checkedLeagues.includes(p.league) && checkedPos.includes(p.pos));
            
            if(filteredDB.length < 3) { alert("Seçtiğin filtrelerde yeterli oyuncu yok! Lütfen filtreleri genişlet."); showScreen('settings-screen'); return; }

            gamePool = shuffleArray(filteredDB);

            currentPlayers = [gamePool.pop(), gamePool.pop(), gamePool.pop()];
            currentPlayerIndex = 0; availableActions = ["oynat", "yedek", "sat"]; assignments = {};

            document.getElementById('last-player-area').style.display = 'none';
            document.getElementById('action-buttons').style.display = 'flex';
            loadNextPlayer(); 
        }

        async function loadNextPlayer() {
            const overlay = document.getElementById('loading-overlay');
            const btns = document.getElementById('action-buttons');
            const lastArea = document.getElementById('last-player-area');
            
            btns.style.pointerEvents = 'none'; btns.style.opacity = '0.4';
            overlay.style.opacity = '1'; overlay.style.visibility = 'visible';
            document.getElementById('turn-text').innerText = (currentPlayerIndex + 1) + ". OYUNCU";

            let player = currentPlayers[currentPlayerIndex];
            let leagueData = LEAGUE_META[player.league];
            let logoUrl = TEAM_LOGOS[player.team] || FALLBACK_LOGOS[player.team] || "https://ui-avatars.com/api/?name=" + encodeURIComponent(player.team);
            
            document.getElementById('player-image').src = await fetchPlayerImage(player.name);
            document.getElementById('player-name').innerText = player.name;
            document.getElementById('player-team').innerText = player.team;
            
            let logoImgEl = document.getElementById('player-team-logo');
            let bgLogoEl = document.getElementById('card-bg-logo');
            logoImgEl.alt = player.team;
            bgLogoEl.alt = player.team;
            
            bgLogoEl.style.display = 'block';
            logoImgEl.src = logoUrl;
            bgLogoEl.src = logoUrl;
            
            let ratingBadge = document.getElementById('player-rating');
            if(isHardMode) { 
                ratingBadge.innerText = "Reyting: ??"; 
                ratingBadge.style.background = "#64748b";
                ratingBadge.style.color = "#ffffff";
            } else { 
                ratingBadge.innerText = "Reyting: " + player.rating; 
                ratingBadge.style.background = "var(--accent)"; 
                ratingBadge.style.color = "#0f172a";
            }
            
            let posEl = document.getElementById('player-pos');
            posEl.innerText = player.pos; posEl.className = "pos-badge pos-" + player.pos;

            document.getElementById('player-league-name').innerText = leagueData.name;
            document.getElementById('player-league-icon').innerText = leagueData.icon;
            
            setTimeout(() => { 
                overlay.style.opacity = '0';
                setTimeout(() => { overlay.style.visibility = 'hidden'; }, 200);
                
                if (currentPlayerIndex === 2) {
                    btns.style.display = 'none'; lastArea.style.display = 'flex';
                    let actText = availableActions[0] === 'oynat' ? 'İLK 11\'E YERLEŞTİ' : (availableActions[0] === 'yedek' ? 'YEDEK BIRAKILDI' : 'TRANSFER EDİLDİ');
                    let actColor = availableActions[0] === 'oynat' ? 'var(--play-color)' : (availableActions[0] === 'yedek' ? 'var(--bench-color)' : 'var(--sell-color)');
                    let actTextColor = availableActions[0] === 'sat' ? '#ffffff' : '#000000';
                    let dbadge = document.getElementById('last-action-display');
                    dbadge.innerText = actText; dbadge.style.backgroundColor = actColor; dbadge.style.borderColor = actColor; dbadge.style.color = actTextColor;
                } else {
                    btns.style.pointerEvents = 'auto'; btns.style.opacity = '1';
                    document.getElementById('btn-oynat').style.display = availableActions.includes('oynat') ? 'flex' : 'none';
                    document.getElementById('btn-yedek').style.display = availableActions.includes('yedek') ? 'flex' : 'none';
                    document.getElementById('btn-sat').style.display = availableActions.includes('sat') ? 'flex' : 'none';
                }
            }, 250);
        }

        async function selectAction(action) {
            playSound();
            currentPlayers[currentPlayerIndex].loadedImg = document.getElementById('player-image').src;
            assignments[action] = currentPlayers[currentPlayerIndex];
            availableActions = availableActions.filter(a => a !== action);
            currentPlayerIndex++;
            if (currentPlayerIndex === 2) { assignments[availableActions[0]] = currentPlayers[2]; loadNextPlayer(); } 
            else { loadNextPlayer(); }
        }

        function endGame() {
            playSound();
            currentPlayers[2].loadedImg = document.getElementById('player-image').src;
            showScreen('result-screen');
            let resultsHtml = '', totalScore = 0;
            const actD = {
                'oynat': { label: 'İLK 11', badge: 'badge-play', calc: r => r },
                'yedek': { label: 'YEDEK', badge: 'badge-bench', calc: r => Math.floor(r / 2) },
                'sat': { label: 'SATILDI', badge: 'badge-sell', calc: r => (100 - r) }
            };

            for (let act of ["oynat", "yedek", "sat"]) {
                let p = assignments[act], points = actD[act].calc(p.rating); totalScore += points;
                let logoUrl = TEAM_LOGOS[p.team] || FALLBACK_LOGOS[p.team] || "";
                resultsHtml += `
                    <div class="result-item">
                        <div class="result-player-info">
                            <img class="res-player-img" src="${p.loadedImg}">
                            <div style="overflow: hidden; width: 100%;">
                                <strong style="display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; font-size: 12px;">${p.name}</strong> 
                                <span style="font-size:10px; color:var(--text-muted); display: flex; align-items: center; gap: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; margin-top:2px;">
                                    <img class="res-team-logo" src="${logoUrl}" referrerpolicy="no-referrer" onerror="handleImgError(this)" alt="${p.team}"> ${p.team} <span class="pos-badge pos-${p.pos}" style="font-size:8px;">${p.pos}</span> R: ${p.rating}
                                </span>
                            </div>
                        </div>
                        <div style="text-align: right; flex-shrink: 0; min-width: 55px;">
                            <span class="badge ${actD[act].badge}">${actD[act].label}</span><br>
                            <strong style="color:var(--green); font-size:13px; display:inline-block; margin-top:2px;">+${points}</strong>
                        </div>
                    </div>`;
            }
            document.getElementById('results-list').innerHTML = resultsHtml;
            
            const scoreEl = document.getElementById('total-score');
            scoreEl.innerText = totalScore;
            scoreEl.classList.remove('score-fadeIn');
            void scoreEl.offsetWidth;
            scoreEl.classList.add('score-fadeIn');

            saveToHistory(totalScore);
            updateHighScoreDisplay();
        }

        function saveToHistory(score) {
            let hist = JSON.parse(localStorage.getItem('fks_history')) || [];
            hist.unshift({ date: new Date().toLocaleString('tr-TR', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' }), score: score }); 
            if (hist.length > 30) hist.pop(); 
            localStorage.setItem('fks_history', JSON.stringify(hist));
        }

        function loadHistory() {
            let hist = JSON.parse(localStorage.getItem('fks_history')) || [];
            let list = document.getElementById('history-list');
            if(hist.length === 0) { list.innerHTML = '<p style="text-align:center; color:var(--text-muted); margin-top:20px; font-size:13px;">Henüz maç oynamadın.</p>'; return; }
            list.innerHTML = hist.map(m => `
                <div style="display:flex; justify-content:space-between; margin-bottom:8px; background:rgba(255,255,255,0.05); padding:10px 12px; border-radius:10px; border:1px solid rgba(255,255,255,0.08);">
                    <div><i class="fa-solid fa-calendar-days" style="color:var(--text-muted);"></i> <span style="font-size:12px;">${m.date}</span></div>
                    <strong style="color:var(--accent); font-size:13px;">${m.score} Puan</strong>
                </div>`).join('');
        }

        function clearHistory() {
            if(confirm("Geçmişi silmek istediğine emin misin?")) { 
                localStorage.removeItem('fks_history'); 
                loadHistory(); 
                updateHighScoreDisplay();
            }
        }
